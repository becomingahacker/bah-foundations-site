url: "https://becomingahacker.com"
# baseurl: "/training"

markdown: kramdown
highlighter: rouge
kramdown:
    input: GFM
    syntax_highlighter: rouge

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"

tailwindcss:
  css_path: "./_tailwind.css" # this is the default location

exclude:
  ['README.md', 'Gemfile.lock', 'Gemfile', 'non-published']

